<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🔥火眼金睛👀</title>
<style>:root{--orange:#f26b21;--coral:#ef476f;--blue:#2563eb;--green:#16a34a;--ink:#27364b;--line:#d8e0ea}*{box-sizing:border-box}body{font-family:Arial,"Microsoft JhengHei",sans-serif;max-width:1060px;margin:0 auto;padding:18px;background:linear-gradient(145deg,#fff6eb,#fff 47%,#eef7ff);color:var(--ink)}.hero{background:linear-gradient(105deg,#fff1e8,#ffeef2 52%,#eef4ff);color:#7c3f2c;border-radius:24px;padding:22px;box-shadow:0 10px 28px #ef476f18}.hero h1{margin:0;font-size:clamp(26px,5vw,42px)}.hero p{margin:8px 0 0}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.btn,.pick{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;box-shadow:0 5px 12px #00000012}.pick{background:#dbeafe;color:#2453a6}.finish{background:#dcfce7;color:#26734a}.reset{background:#fff1c7;color:#8a5a13}.clear{background:#fee2e2;color:#aa4545}.cancel{background:#fff;border:1px solid var(--line);color:#334155}.apply{background:#dbeafe;color:#2453a6}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);aspect-ratio:4/5;background:#fff;border:3px solid #fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 38px #1e293b1a}.cell{position:relative;overflow:hidden;background:#fff;border:1px solid #e5e7eb;touch-action:none;cursor:pointer}.cell img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none}.num{position:absolute;z-index:2;left:7px;top:7px;background:linear-gradient(135deg,#ffd8bf,#ffcdd8);color:#8f452d;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800;box-shadow:0 3px 8px #0003}.plus{position:absolute;inset:0;display:grid;place-items:center;color:#f97316;font-size:28px;font-weight:800;opacity:.65}.cell.hasimg .plus{display:none}.editTag{position:absolute;z-index:2;right:5px;bottom:5px;background:#dbeafe;color:#2453a6;border-radius:7px;padding:4px 6px;font-size:10px;display:none}.cell.hasimg .editTag{display:block}.modalbg{position:fixed;z-index:50;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:14px}.modal{background:#fff;color:#172033;border-radius:20px;padding:18px;width:min(94vw,520px);box-shadow:0 22px 65px #0006}.modal h3{margin:0 0 8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.editorFrame{width:min(82vw,420px);aspect-ratio:1;margin:12px auto;background:#fff;border:2px solid #334155;overflow:hidden;position:relative;touch-action:none;user-select:none}.editorFrame img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none;user-select:none}.hint{text-align:center;color:#64748b;font-size:13px}.zoomRow{display:flex;align-items:center;gap:8px}.zoomRow input{flex:1}#status{margin:12px 2px;color:#64748b;font-weight:600}@media(max-width:600px){body{padding:10px}.hero{padding:18px}.bar .btn,.bar .pick{flex:1;text-align:center}.actions .btn{flex:1}}</style></head><body>
<div class="hero"><h1>🔥火眼金睛👀</h1><p>請依照20張指定照片的順序，對應編號後上傳合照</p></div>
<div class="bar"><label class="pick">📷 一次選擇照片<input id="bulk" class="hidden" type="file" accept="image/*" multiple></label><button id="complete" class="btn finish">✨ 選擇完成</button><button id="reset" class="btn reset">↺ 重設編輯</button><button id="clear" class="btn clear">全部清除</button><button id="download" class="hidden">下載</button></div>
<div id="grid" class="grid"></div><div id="inputs" class="hidden"></div><div id="status" aria-live="polite"></div>
<div id="editorBg" class="modalbg"><div class="modal"><h3>✨ 編輯這張照片</h3><p class="hint">單指／滑鼠拖曳，雙指捏合／滾輪縮放。</p><div id="editorFrame" class="editorFrame"><img id="editorImg" alt="照片編輯預覽"></div><div class="bar"><button id="fitCover" class="btn apply">1:1 填滿</button><button id="fitContain" class="btn cancel">保留原比例</button><button id="rotL" class="btn cancel">↶ 左轉 90°</button><button id="rotR" class="btn cancel">↷ 右轉 90°</button></div><div id="fitHint" class="hint"></div><div class="zoomRow"><span>縮放</span><input id="editorZoom" type="range" min="50" max="500" value="100"><span id="editorPct">100%</span></div><div class="actions"><button id="center" class="btn reset">重新置中</button><button id="editCancel" class="btn cancel">取消</button><button id="apply" class="btn apply">套用</button></div></div></div>
<div id="completeBg" class="modalbg"><div class="modal"><h3>🎉 照片選擇完成！</h3><p>要現在下載這 20 格組成的照片嗎？未選照片的位置會保留白底。</p><div class="actions"><button id="continueEdit" class="btn cancel">繼續調整</button><button id="downloadNow" class="btn finish">📥 下載 20 張組圖</button></div></div></div>
<div id="previewBg" class="modalbg"><div class="modal" style="width:min(96vw,680px);max-height:92vh;overflow:auto"><h3>🎉 組圖完成！</h3><p class="hint">請確認下方組圖，完成後依手機系統的選項儲存圖片。</p><div style="text-align:center;background:#fff7ed;color:#9a4b16;border-radius:12px;padding:9px 12px;margin:8px 0;font-weight:700">📱 長按下方組圖儲存｜iPhone：儲存到照片｜Android：下載圖片</div><img id="finalPreview" alt="20張照片組圖預覽" style="display:block;width:min(100%,520px);height:auto;margin:12px auto;border-radius:14px;border:1px solid #e2e8f0;background:#fff"><div class="actions"><button id="backEdit" class="btn cancel">↩️ 繼續調整</button></div></div></div>
<div id="clearBg" class="modalbg"><div class="modal"><h3>確定要全部清除嗎？</h3><p>20 張照片與編輯設定都會被移除，所有位置將恢復為白底。</p><p style="color:#dc2626;font-weight:800">此操作無法復原。</p><div class="actions"><button id="clearCancel" class="btn cancel">取消</button><button id="confirmClear" class="btn clear">確定全部清除</button></div></div></div>
<script>(()=>{const $=s=>document.querySelector(s),grid=$('#grid'),inputsBox=$('#inputs'),bulk=$('#bulk'),status=$('#status'),editorBg=$('#editorBg'),completeBg=$('#completeBg'),clearBg=$('#clearBg'),previewBg=$('#previewBg'),finalPreview=$('#finalPreview'),editorFrame=$('#editorFrame'),editorImg=$('#editorImg'),editorZoom=$('#editorZoom'),editorPct=$('#editorPct');const cells=[],inputs=[],data=Array.from({length:20},()=>({img:null,src:'',scale:1,x:0,y:0,rot:0,fit:'cover'}));let active=-1,draft=null,drag=null,pinch=null;function tf(el,s,box){if(!s?.img)return;const base=(s.fit==='contain'?Math.min:Math.max)(box/s.img.naturalWidth,box/s.img.naturalHeight),w=s.img.naturalWidth*base*s.scale,h=s.img.naturalHeight*base*s.scale;el.style.width=w+'px';el.style.height=h+'px';el.style.transform=`translate(calc(-50% + ${s.x*box}px),calc(-50% + ${s.y*box}px)) rotate(${s.rot||0}deg)`}function render(i){const s=data[i],c=cells[i];let im=c.querySelector('img');if(!s.img){im?.remove();c.classList.remove('hasimg');return}if(!im){im=document.createElement('img');c.appendChild(im)}im.src=s.src;c.classList.add('hasimg');tf(im,s,c.clientWidth)}function fitUI(){let con=draft?.fit==='contain';$('#fitCover').className='btn '+(con?'cancel':'apply');$('#fitContain').className='btn '+(con?'apply':'cancel');$('#fitHint').textContent=con?'保留原比例：完整照片會顯示，其餘區域留白。':'1:1 填滿：照片會填滿正方形，超出部分裁切。'}function edit(i,ns){active=i;let s=ns||data[i];draft={...s};editorImg.src=draft.src;editorZoom.value=Math.round(draft.scale*100);editorPct.textContent=editorZoom.value+'%';fitUI();editorBg.style.display='flex';requestAnimationFrame(()=>tf(editorImg,draft,editorFrame.clientWidth))}function load(i,f,auto=true){if(!f?.type.startsWith('image/'))return;let r=new FileReader;r.onload=e=>{let im=new Image;im.onload=()=>{let ns={img:im,src:e.target.result,scale:1,x:0,y:0,rot:0,fit:'cover'};auto?edit(i,ns):(data[i]=ns,render(i))};im.src=e.target.result};r.readAsDataURL(f)}for(let i=0;i<20;i++){let c=document.createElement('div');c.className='cell';c.innerHTML=`<span class="num">${i+1}</span><span class="plus">＋</span><span class="editTag">點擊編輯</span>`;grid.appendChild(c);cells.push(c);let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>inp.files[0]&&load(i,inp.files[0]);inputsBox.appendChild(inp);inputs.push(inp);c.onclick=()=>data[i].img?edit(i):inp.click()}bulk.onchange=()=>{[...bulk.files].slice(0,20).forEach((f,i)=>load(i,f,false));status.textContent='照片已載入，點任一格可繼續調整。'};$('#fitCover').onclick=()=>{draft.fit='cover';draft.scale=1;draft.x=draft.y=0;editorZoom.value=100;editorPct.textContent='100%';fitUI();tf(editorImg,draft,editorFrame.clientWidth)};$('#fitContain').onclick=()=>{draft.fit='contain';draft.scale=1;draft.x=draft.y=0;editorZoom.value=100;editorPct.textContent='100%';fitUI();tf(editorImg,draft,editorFrame.clientWidth)};editorZoom.oninput=()=>{draft.scale=+editorZoom.value/100;editorPct.textContent=editorZoom.value+'%';tf(editorImg,draft,editorFrame.clientWidth)};const pts=new Map();editorFrame.onpointerdown=e=>{editorFrame.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:draft.x,sy:draft.y};};editorFrame.onpointermove=e=>{if(!draft||!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...pts.values()];if(a.length>=2){let d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(!pinch)pinch={dist:d,start:draft.scale};draft.scale=Math.min(5,Math.max(.5,pinch.start*d/pinch.dist));editorZoom.value=Math.round(draft.scale*100);editorPct.textContent=editorZoom.value+'%'}else if(drag){let box=editorFrame.clientWidth;draft.x=drag.sx+(e.clientX-drag.x)/box;draft.y=drag.sy+(e.clientY-drag.y)/box}tf(editorImg,draft,editorFrame.clientWidth)};function end(e){pts.delete(e.pointerId);if(!pts.size)drag=null;if(pts.size<2)pinch=null}editorFrame.onpointerup=end;editorFrame.onpointercancel=end;editorFrame.addEventListener('wheel',e=>{e.preventDefault();draft.scale=Math.min(5,Math.max(.5,draft.scale*(e.deltaY<0?1.08:.92)));editorZoom.value=Math.round(draft.scale*100);editorPct.textContent=editorZoom.value+'%';tf(editorImg,draft,editorFrame.clientWidth)},{passive:false});$('#rotL').onclick=()=>{draft.rot=(draft.rot-90)%360;tf(editorImg,draft,editorFrame.clientWidth)};$('#rotR').onclick=()=>{draft.rot=(draft.rot+90)%360;tf(editorImg,draft,editorFrame.clientWidth)};$('#center').onclick=()=>{draft.scale=1;draft.x=draft.y=0;draft.rot=0;editorZoom.value=100;editorPct.textContent='100%';tf(editorImg,draft,editorFrame.clientWidth)};$('#editCancel').onclick=()=>{editorBg.style.display='none';draft=null;active=-1};$('#apply').onclick=()=>{data[active]=draft;render(active);editorBg.style.display='none';status.textContent=`第 ${active+1} 格已完成編輯。`;draft=null;active=-1};$('#reset').onclick=()=>{data.forEach((s,i)=>{if(s.img){s.scale=1;s.x=s.y=0;s.rot=0;render(i)}});status.textContent='照片已全部重新置中。'};$('#clear').onclick=()=>clearBg.style.display='flex';$('#clearCancel').onclick=()=>clearBg.style.display='none';$('#confirmClear').onclick=()=>{for(let i=0;i<20;i++){data[i]={img:null,src:'',scale:1,x:0,y:0,rot:0,fit:'cover'};inputs[i].value='';render(i)}bulk.value='';clearBg.style.display='none';status.textContent='已全部清除。'};$('#complete').onclick=()=>{completeBg.style.display='flex';$('#downloadNow').focus()};$('#continueEdit').onclick=()=>{completeBg.style.display='none';$('#complete').focus()};let finalBlob=null,finalUrl='';async function generatePreview(){status.textContent='正在產生組圖預覽…';const W=2400,H=3000,cw=600,ch=600,o=document.createElement('canvas');o.width=W;o.height=H;const ctx=o.getContext('2d');if(!ctx)throw Error('無法建立組圖畫布');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);data.forEach((s,i)=>{if(!s.img)return;const iw=s.img.naturalWidth||s.img.width,ih=s.img.naturalHeight||s.img.height;if(!iw||!ih)return;const b=(s.fit==='contain'?Math.min:Math.max)(cw/iw,ch/ih),w=iw*b*s.scale,h=ih*b*s.scale,col=i%4,row=Math.floor(i/4);ctx.save();ctx.beginPath();ctx.rect(col*cw,row*ch,cw,ch);ctx.clip();ctx.translate(col*cw+cw/2+s.x*cw,row*ch+ch/2+s.y*ch);ctx.rotate((s.rot||0)*Math.PI/180);ctx.drawImage(s.img,-w/2,-h/2,w,h);ctx.restore()});const lineWidth=16;ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=lineWidth;for(let col=1;col<4;col++){const x=col*cw;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let row=1;row<5;row++){const y=row*ch;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeRect(lineWidth/2,lineWidth/2,W-lineWidth,H-lineWidth);ctx.restore();finalBlob=await new Promise((res,rej)=>o.toBlob(b=>b?res(b):rej(Error('PNG 產生失敗')),'image/png'));if(finalUrl)URL.revokeObjectURL(finalUrl);finalUrl=URL.createObjectURL(finalBlob);finalPreview.src=finalUrl;previewBg.style.display='flex';status.textContent='組圖預覽已完成。'}$('#downloadNow').onclick=async()=>{completeBg.style.display='none';try{await generatePreview()}catch(e){status.textContent='產生預覽失敗：'+e.message}};$('#backEdit').onclick=()=>{previewBg.style.display='none';$('#complete').focus()};$('#download').onclick=generatePreview;window.onresize=()=>data.forEach((s,i)=>s.img&&render(i));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(editorBg.style.display==='flex')$('#editCancel').click();else if(completeBg.style.display==='flex')$('#continueEdit').click();else if(clearBg.style.display==='flex')$('#clearCancel').click();else if(previewBg.style.display==='flex')$('#backEdit').click()}})})();</script></body></html>
